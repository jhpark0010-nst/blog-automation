name: Reviewer (발행글 사후 감사)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviewer
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Reviewer 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/review.py

      - name: Commit & push review-actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/review-actions.json
          if ! git diff --staged --quiet; then
            git commit -m "review: FIX 액션 추가"
            git pull --rebase origin main
            git push origin main
          else
            echo "FIX 액션 없음 (PASS 또는 NOTIFY만)"
          fi
