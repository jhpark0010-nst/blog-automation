name: RSS 수집 및 필터링

on:
  schedule:
    # ── 매일 6회 (KST → UTC 변환) ──
    - cron: '0 23 * * *'   # KST 08시
    - cron: '0 1 * * *'    # KST 10시
    - cron: '0 3 * * *'    # KST 12시
    - cron: '0 5 * * *'    # KST 14시
    - cron: '0 7 * * *'    # KST 16시
    - cron: '0 11 * * *'   # KST 20시

  # 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 및 필터링
        run: python scripts/collect_and_filter.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
            PENDING_COUNT=$(python -c "import json; d=json.load(open('data/pending.json')); print(len(d.get('items',[])))" 2>/dev/null || echo "0")
            git commit -m "RSS 수집: ${TIMESTAMP} (대기 ${PENDING_COUNT}건)"
            git push
          fi
